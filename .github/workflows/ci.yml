name: CI

on:
  push:
  pull_request:

jobs:
  cli-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .[test]

      - name: Module help smoke
        run: python -m local_translation_workbench help

      - name: Console script help smoke
        run: ltw help

      - name: Doctor smoke
        run: ltw doctor

      - name: POSIX launcher smoke
        if: runner.os != 'Windows'
        run: sh scripts/run.sh help

      - name: PowerShell launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run.ps1 help

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_translation_workbench_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      PYTHONUTF8: "1"
      LTW_TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/local_translation_workbench_test
      LTW_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/local_translation_workbench_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests -q
